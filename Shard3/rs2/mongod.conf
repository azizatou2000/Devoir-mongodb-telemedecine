systemLog:
  destination: file
  path: C:\MONGODB\Cluster\Shard3\rs2\log\mongod.log
  logAppend: true

storage:
  dbPath: C:\MONGODB\Cluster\Shard3\rs2\data

processManagement:
  windowsService:
    serviceName: MongoShard3_2
    displayName: Mongo Shard 3 Node 2

net:
  bindIp: localhost
  port: 27122

sharding:
  clusterRole: shardsvr

replication:
  replSetName: ShardRS3

security:
  keyFile: C:\MONGODB\Cluster\KeyFile\mongodb-keyfile
