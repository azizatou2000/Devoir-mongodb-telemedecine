systemLog:
  destination: file
  path: C:\MONGODB\Cluster\Shard1\rs2\log\mongod.log
  logAppend: true

storage:
  dbPath: C:\MONGODB\Cluster\Shard1\rs2\data

processManagement:
  windowsService:
    serviceName: MongoShard1_2
    displayName: Mongo Shard 1 Node 2

net:
  bindIp: localhost
  port: 27102

sharding:
  clusterRole: shardsvr

replication:
  replSetName: ShardRS1

security:
  keyFile: C:\MONGODB\Cluster\KeyFile\mongodb-keyfile
