systemLog:
  destination: file
  path: C:\MONGODB\Cluster\Shard2\rs1\log\mongod.log
  logAppend: true

storage:
  dbPath: C:\MONGODB\Cluster\Shard2\rs1\data

processManagement:
  windowsService:
    serviceName: MongoShard2_1
    displayName: Mongo Shard 2 Node 1

net:
  bindIp: localhost
  port: 27111

sharding:
  clusterRole: shardsvr

replication:
  replSetName: ShardRS2

security:
  keyFile: C:\MONGODB\Cluster\KeyFile\mongodb-keyfile
